import pandas as pd


def summarize(df):
    """ملخص فني من شموع 15 دقيقة (أعمدة Close/High/Low)."""
    c, h, l = df["Close"].astype(float), df["High"].astype(float), df["Low"].astype(float)
    ema20 = c.ewm(span=20, adjust=False).mean()
    ema50 = c.ewm(span=50, adjust=False).mean()

    delta = c.diff()
    up = delta.clip(lower=0).ewm(alpha=1 / 14, adjust=False).mean()
    down = (-delta.clip(upper=0)).ewm(alpha=1 / 14, adjust=False).mean()
    rsi = 100 - 100 / (1 + up / down.replace(0, 1e-9))

    tr = pd.concat([h - l, (h - c.shift()).abs(), (l - c.shift()).abs()], axis=1).max(axis=1)
    atr = tr.ewm(alpha=1 / 14, adjust=False).mean()

    last = float(c.iloc[-1])

    def chg(n):
        return round((last / float(c.iloc[-1 - n]) - 1) * 100, 3) if len(c) > n else None

    day = df.tail(96)
    return {
        "price": round(last, 2),
        "ema20": round(float(ema20.iloc[-1]), 2),
        "ema50": round(float(ema50.iloc[-1]), 2),
        "rsi14": round(float(rsi.iloc[-1]), 1),
        "atr14_usd": round(float(atr.iloc[-1]), 2),
        "change_1h_pct": chg(4),
        "change_4h_pct": chg(16),
        "high_24h": round(float(day["High"].max()), 2),
        "low_24h": round(float(day["Low"].min()), 2),
        "trend": "up" if ema20.iloc[-1] > ema50.iloc[-1] else "down",
    }

"""سجل الإشارات: يتابع كل إشارة على الشموع ويحسب نتيجتها (هدف/وقف) والإحصائيات."""
import csv
from datetime import datetime

import pandas as pd

import config

TIMEOUT_H = 24
CSV_FILE = "signals.csv"


def new_stats():
    return {"n": 0, "wins": 0, "losses": 0, "be": 0, "pnl": 0.0}


def register(st, trade, now):
    st.setdefault("open", []).append({**trade, "ts": now.isoformat(),
                                      "tp1_hit": False, "sl_cur": trade["sl"], "banked": 0.0})


def _utc(df):
    idx = df.index
    return idx.tz_localize("UTC") if idx.tz is None else idx.tz_convert("UTC")


def evaluate(sig, df, now):
    """يرجع (outcome, pnl) إذا انتهت الإشارة، وإلا None. يحدّث sig (TP1/الوقف المتحرك)."""
    ts = pd.Timestamp(sig["ts"])
    ts = ts.tz_localize("UTC") if ts.tzinfo is None else ts
    buy = sig["direction"] == "BUY"
    s = 1 if buy else -1
    unit, d, lot = config.CONTRACT_SIZE, sig["sl_dist"], sig["lot"]
    rem = round(lot - sig["lot_tp1"], 2) if sig["partial"] else lot

    for t, hi, lo in zip(_utc(df), df["High"], df["Low"]):
        if t <= ts:
            continue
        hi, lo = float(hi), float(lo)
        if (lo <= sig["sl_cur"]) if buy else (hi >= sig["sl_cur"]):      # الوقف أولاً (تحفظ)
            if sig["tp1_hit"]:
                return "TP1+BE", round(sig["banked"], 2)
            return "SL", round(-lot * unit * d, 2)
        if sig["partial"] and not sig["tp1_hit"]:
            if (hi >= sig["tp1"]) if buy else (lo <= sig["tp1"]):
                sig["tp1_hit"] = True
                sig["banked"] = sig["lot_tp1"] * unit * d
                sig["sl_cur"] = sig["entry"]
                continue                                                  # الوقف المتحرك يُفحص بالشمعة التالية
        if sig["tp1_hit"] or not sig["partial"]:
            if (hi >= sig["tp2"]) if buy else (lo <= sig["tp2"]):
                return "TP2", round(sig["banked"] + rem * unit * d * config.RR, 2)

    if (now - datetime.fromisoformat(sig["ts"])).total_seconds() > TIMEOUT_H * 3600:
        last = float(df["Close"].iloc[-1])
        floating = rem * unit * (last - sig["entry"]) * s
        return "TIMEOUT", round(sig["banked"] + floating, 2)
    return None


def update_signals(st, df, now):
    closed, still = [], []
    stats = st.setdefault("stats", new_stats())
    for sig in st.get("open", []):
        res = evaluate(sig, df, now)
        if res is None:
            still.append(sig)
            continue
        outcome, pnl = res
        stats["n"] += 1
        stats["pnl"] = round(stats["pnl"] + pnl, 2)
        stats["wins" if pnl > 0 else "losses" if pnl < 0 else "be"] += 1
        closed.append((sig, outcome, pnl))
        try:
            with open(CSV_FILE, "a", newline="", encoding="utf-8") as f:
                csv.writer(f).writerow([sig["ts"], sig["direction"], sig["entry"], sig["sl"],
                                        sig["tp2"], sig["lot"], outcome, pnl])
        except OSError:
            pass
    st["open"] = still
    return closed


def format_result(sig, outcome, pnl, stats):
    names = {"SL": "ضرب الوقف ❌", "TP2": "حقق الهدف الثاني ✅",
             "TP1+BE": "الهدف الأول ثم رجع للدخول ➖", "TIMEOUT": "أُغلقت بعد 24 ساعة ⏱"}
    wr = round(100 * stats["wins"] / stats["n"]) if stats["n"] else 0
    return (f"📊 نتيجة إشارة {sig['direction']} عند {sig['entry']}: {names.get(outcome, outcome)}\n"
            f"الربح/الخسارة: {pnl:+.2f}$\n"
            f"الإجمالي: {stats['n']} صفقة | رابحة {stats['wins']} | خاسرة {stats['losses']} | "
            f"نسبة النجاح {wr}% | صافي {stats['pnl']:+.2f}$")

import json
import re
from datetime import datetime

import config
from models import Vote

_client = None


def parse_json(text):
    m = re.search(r"\{.*\}", text, re.S)
    if not m:
        raise ValueError("no JSON in model output")
    return json.loads(m.group(0))


def ask_json(system, user):
    global _client
    import anthropic
    if _client is None:
        _client = anthropic.Anthropic(api_key=config.ANTHROPIC_API_KEY)
    resp = _client.messages.create(
        model=config.MODEL, max_tokens=700, system=system,
        messages=[{"role": "user", "content": user}],
    )
    text = "".join(b.text for b in resp.content if b.type == "text")
    return parse_json(text)


def to_vote(agent, data, now=None):
    d = str(data.get("direction", "NEUTRAL")).upper().strip()
    if d not in ("BUY", "SELL", "NEUTRAL"):
        d = "NEUTRAL"
    try:
        conf = int(max(0, min(100, float(data.get("confidence", 0)))))
    except (TypeError, ValueError):
        conf = 0
    try:
        mult = float(data.get("sl_atr_mult", config.ATR_MULT_DEFAULT))
    except (TypeError, ValueError):
        mult = config.ATR_MULT_DEFAULT
    mult = max(1.0, min(2.5, mult))
    return Vote(agent, d, conf, str(data.get("reason_ar", ""))[:300],
                now or datetime.now(), mult)

"""فريق الذهب: القناص + المحقق + البروفيسور. نسخة تجريبية: إشعار تلكرام بدون تنفيذ."""
import json
import os
import sys
import time
from datetime import datetime, timedelta, timezone
from types import SimpleNamespace

import config
from consensus import agree, is_active, store_vote
import journal
from indicators import summarize
from models import Vote
from risk import build_trade

STATE_FILE = "state.json"
AR_DIR = {"BUY": "شراء 🟢", "SELL": "بيع 🔴"}


def log(*a):
    print(datetime.now().strftime("%H:%M:%S"), *a, flush=True)


# ---------- الحالة ----------
def load_state():
    if os.path.exists(STATE_FILE):
        try:
            return json.load(open(STATE_FILE, encoding="utf-8"))
        except Exception:
            pass
    return {"seen": [], "day": "", "count": 0, "last_signal": None, "last_prof": None}


def save_state(st):
    st["seen"] = st["seen"][-2000:]
    json.dump(st, open(STATE_FILE, "w", encoding="utf-8"), ensure_ascii=False)


def votes_to_json(votes):
    return {k: {"agent": v.agent, "direction": v.direction, "confidence": v.confidence,
                "reason": v.reason, "ts": v.ts.isoformat(), "sl": v.sl_atr_mult}
            for k, v in votes.items()}


def votes_from_json(d):
    out = {}
    for k, v in (d or {}).items():
        try:
            out[k] = Vote(v["agent"], v["direction"], int(v["confidence"]), v["reason"],
                          datetime.fromisoformat(v["ts"]), float(v.get("sl", 1.5)))
        except Exception:
            pass
    return out


def new_items(items, st):
    seen = set(st["seen"])
    fresh = []
    for it in sorted(items, key=lambda x: (x["tier"], x["age_min"])):
        if it["id"] in seen or it["age_min"] > config.MAX_ITEM_AGE_MIN:
            continue
        seen.add(it["id"])
        st["seen"].append(it["id"])
        fresh.append(it)
    return fresh[:config.MAX_ITEMS_PER_AGENT]


def _ago_min(iso, now):
    return (now - datetime.fromisoformat(iso)).total_seconds() / 60 if iso else 1e9


def in_blackout(now):
    w = timedelta(minutes=config.BLACKOUT_WINDOW_MIN)
    for s in config.BLACKOUT_UTC:
        t = datetime.fromisoformat(s).replace(tzinfo=timezone.utc)
        if abs(now - t) <= w:
            return True
    return False


# ---------- نص الإشعار ----------
def format_signal(t, votes, ind):
    icons = {"sniper": "🎯 القناص", "detective": "🕵️ المحقق", "professor": "🎓 البروفيسور"}
    lines = [
        "🔔 إشارة ذهب (تجريبية، بدون تنفيذ)",
        f"الاتجاه: {AR_DIR[t['direction']]}",
        f"الدخول التقريبي: {t['entry']}",
        f"وقف الخسارة: {t['sl']} (مسافة {t['sl_dist']}$)",
        f"الهدف 1: {t['tp1']} | الهدف 2: {t['tp2']}",
        f"الحجم المقترح: {t['lot']} لوت (مخاطرة ≈ {t['risk_usd']}$ = {t['risk_pct']}%)",
    ]
    if t["partial"]:
        lines.append(f"عند الهدف 1: اغلق {t['lot_tp1']} لوت وانقل الوقف لنقطة الدخول")
    else:
        lines.append("الحجم صغير: بدون إغلاق جزئي، هدف واحد (الهدف 2)")
    lines.append(f"RSI {ind['rsi14']} | ATR {ind['atr14_usd']}$ | اتجاه {ind['trend']}")
    lines.append("— الأصوات —")
    for k in ("sniper", "detective", "professor"):
        v = votes[k]
        lines.append(f"{icons[k]} ({v.confidence}): {v.reason}")
    return "\n".join(lines)


# ---------- دورة واحدة ----------
def cycle(S, st, votes, now=None):
    now = now or datetime.now(timezone.utc)
    ttl, minc = config.VOTE_TTL_MIN, config.MIN_CONFIDENCE

    df = S.get_prices()
    if df is None or S.minutes_stale(df) > config.STALE_MIN:
        log("السوق مغلق أو لا توجد بيانات سعر")
        return
    ind = summarize(df)

    for sig, outcome, pnl in journal.update_signals(st, df, now):
        S.notify(journal.format_result(sig, outcome, pnl, st["stats"]))

    items = S.sniper_items(st)
    if items:
        log(f"القناص: {len(items)} خبر جديد")
        store_vote(votes, "sniper", S.sniper_vote(items, ind, now), now, ttl)
    items = S.detective_items(st)
    if items:
        log(f"المحقق: {len(items)} خبر جديد")
        store_vote(votes, "detective", S.detective_vote(items, ind, now), now, ttl)

    for k in ("sniper", "detective"):
        v = votes.get(k)
        if v:
            log(f"  {k}: {v.direction} ({v.confidence})")

    if not agree(votes, ("sniper", "detective"), now, ttl, minc):
        return

    # القناص والمحقق متفقان: البروفيسور يعطي القرار النهائي
    if _ago_min(st.get("last_prof"), now) >= config.PROFESSOR_RECHECK_MIN:
        st["last_prof"] = now.isoformat()
        store_vote(votes, "professor", S.professor_vote(ind, now), now, ttl)
        v = votes.get("professor")
        log(f"  professor: {v.direction} ({v.confidence})" if v else "  professor: فشل")

    d = agree(votes, ("sniper", "detective", "professor"), now, ttl, minc)
    if not d:
        return

    # ---- بوابات الأمان ----
    today = now.strftime("%Y-%m-%d")
    if st.get("day") != today:
        st["day"], st["count"] = today, 0
    if st["count"] >= config.MAX_SIGNALS_PER_DAY:
        log("وصلنا الحد اليومي للإشارات")
        return
    if _ago_min(st.get("last_signal"), now) < config.COOLDOWN_MIN:
        log("فترة انتظار بعد آخر إشارة")
        return
    if in_blackout(now):
        log("قريب من خبر عالي التأثير: لا إشارة")
        return

    t = build_trade(d, ind["price"], ind["atr14_usd"], votes["professor"].sl_atr_mult)
    if t is None:
        log("الرصيد صغير جداً لهذا الوقف: لا صفقة")
        return

    S.notify(format_signal(t, votes, ind))
    journal.register(st, t, now)
    st["count"] += 1
    st["last_signal"] = now.isoformat()
    votes.clear()


# ---------- التشغيل الحقيقي ----------
def real_services():
    import agents
    import notifier
    import sources as src

    def sniper_items(st):
        raw = src.fetch_feeds(config.SNIPER_FEEDS) + src.x_search(config.X_SNIPER_QUERY, "X-Official", 1)
        return new_items(raw, st)

    def detective_items(st):
        raw = src.fetch_feeds(config.DETECTIVE_FEEDS) + src.x_search(config.X_DETECTIVE_QUERY, "X-Community", 2)
        return new_items(raw, st)

    return SimpleNamespace(
        get_prices=src.get_candles, minutes_stale=src.minutes_since_last_candle,
        sniper_items=sniper_items, detective_items=detective_items,
        sniper_vote=agents.sniper_vote, detective_vote=agents.detective_vote,
        professor_vote=agents.professor_vote, notify=notifier.send)


def run_once():
    """دورة واحدة (لـ GitHub Actions): يحمّل الحالة والأصوات، ينفذ، ثم يحفظ."""
    S, st = real_services(), load_state()
    votes = votes_from_json(st.get("votes"))
    try:
        cycle(S, st, votes)
    finally:
        st["votes"] = votes_to_json(votes)
        save_state(st)


def main():
    if not config.ANTHROPIC_API_KEY:
        print("ضع ANTHROPIC_API_KEY في ملف .env")
        return
    if "--once" in sys.argv:
        run_once()
        return
    S, st, votes = real_services(), load_state(), {}
    S.notify("✅ فريق الذهب اشتغل (وضع تجريبي: إشعارات فقط)")
    log("بدأ التشغيل. اضغط Ctrl+C للإيقاف.")
    while True:
        try:
            cycle(S, st, votes)
        except Exception as e:
            log("خطأ في الدورة:", type(e).__name__, str(e)[:200])
        save_state(st)
        time.sleep(config.LOOP_SECONDS)


if __name__ == "__main__":
    main()

